name: Staging — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: youtrack-app-dist
          path: dist/

  deploy:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: youtrack-app-dist
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @jetbrains/youtrack-apps-tools@1.0.3

      - name: Validate YouTrack connectivity
        env:
          YOUTRACK_HOST: ${{ secrets.YOUTRACK_STAGING_HOST }}
        run: |
          if [ -z "$YOUTRACK_HOST" ]; then
            echo "❌ ERROR: YOUTRACK_HOST secret is empty or not set in this GitHub Environment"
            exit 1
          fi
          # Normalize host: strip trailing slash
          HOST=$(echo "$YOUTRACK_HOST" | sed 's|/$||')
          # Ensure https:// prefix
          if [[ "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi
          echo "✅ Testing connectivity to: $HOST"
          curl --fail --silent --max-time 15 \
            -o /dev/null -w "HTTP status: %{http_code}\n" \
            "$HOST/api/admin/apps" \
            || echo "⚠️  Connectivity check failed (may be auth-required, check HTTP status above)"

      - name: Upload to YouTrack (Staging)
        env:
          YOUTRACK_HOST: ${{ secrets.YOUTRACK_STAGING_HOST }}
          YOUTRACK_API_TOKEN: ${{ secrets.YOUTRACK_STAGING_TOKEN }}
          NODE_OPTIONS: '--enable-source-maps'
        run: |
          # Normalize YOUTRACK_HOST: strip trailing slash
          export YOUTRACK_HOST=$(echo "$YOUTRACK_HOST" | sed 's|/$||')
          youtrack-app app upload --directory dist
