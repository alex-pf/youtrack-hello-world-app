stages:
  - build
  - deploy

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_test:
  stage: deploy
  needs:
    - build
  script:
    - npm ci
    - npm run upload
  environment:
    name: test
    url: $YOUTRACK_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
